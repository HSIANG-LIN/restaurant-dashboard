<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ 我的美食地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    padding: 20px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #2a2a4a;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(90deg, #e94560, #f5a623);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .stats {
    font-size: 14px;
    color: #888;
  }
  .header .stats span { color: #f5a623; font-weight: 600; }
  .container {
    display: flex;
    height: calc(100vh - 70px);
  }
  #map {
    flex: 1;
    height: 100%;
  }
  .sidebar {
    width: 380px;
    background: #1a1a2e;
    border-left: 1px solid #2a2a4a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 15px 20px;
    border-bottom: 1px solid #2a2a4a;
    font-weight: 600;
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sidebar-header .count-badge {
    background: #e94560;
    color: #fff;
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 12px;
  }
  .search-box {
    padding: 12px 20px;
    border-bottom: 1px solid #2a2a4a;
  }
  .search-box input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0f0f23;
    color: #e0e0e0;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus {
    border-color: #e94560;
  }
  .search-box input::placeholder { color: #666; }
  .filter-bar {
    padding: 8px 20px 12px;
    border-bottom: 1px solid #1f1f3a;
  }
  .filter-bar select {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0f0f23;
    color: #e0e0e0;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
    appearance: auto;
  }
  .filter-bar select:focus { border-color: #e94560; }
  .filter-bar select option { background: #1a1a2e; color: #e0e0e0; }
  .restaurant-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 0;
  }
  .restaurant-item {
    padding: 14px 20px;
    border-bottom: 1px solid #1f1f3a;
    cursor: pointer;
    transition: background 0.2s;
    position: relative;
  }
  .restaurant-item:hover {
    background: rgba(233, 69, 96, 0.08);
  }
  .restaurant-item.active {
    background: rgba(233, 69, 96, 0.15);
    border-left: 3px solid #e94560;
  }
  .restaurant-item .name {
    font-weight: 600;
    font-size: 15px;
    color: #f0f0f0;
    margin-bottom: 4px;
  }
  .restaurant-item .address {
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
  }
  .restaurant-item .tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .restaurant-item .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(245, 166, 35, 0.15);
    color: #f5a623;
  }
  .restaurant-item .tag.note {
    background: rgba(233, 69, 96, 0.12);
    color: #e94560;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .restaurant-item .tag.gm-link {
    background: rgba(76, 205, 196, 0.15);
    color: #4ecdc4;
    text-decoration: none;
    cursor: pointer;
  }
  .restaurant-item .tag.gm-link:hover {
    background: rgba(76, 205, 196, 0.3);
  }
  .restaurant-item .date {
    position: absolute;
    top: 14px;
    right: 20px;
    font-size: 11px;
    color: #555;
  }
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #555;
    text-align: center;
    padding: 40px;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: #888; }
  .empty-state p { font-size: 13px; line-height: 1.6; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #1a1a2e; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }

  .leaflet-popup-content-wrapper {
    background: #1a1a2e !important;
    color: #e0e0e0 !important;
    border-radius: 12px !important;
    border: 1px solid #2a2a4a !important;
  }
  .leaflet-popup-tip { background: #1a1a2e !important; }
  .leaflet-popup-content {
    margin: 12px 16px !important;
    font-size: 14px !important;
    line-height: 1.5 !important;
  }
  .leaflet-popup-content .popup-name {
    font-weight: 700;
    font-size: 16px;
    color: #f0f0f0;
    margin-bottom: 4px;
  }
  .leaflet-popup-content .popup-addr {
    font-size: 12px;
    color: #888;
    margin-bottom: 8px;
  }
  .leaflet-popup-content .popup-note {
    font-size: 13px;
    color: #ccc;
    padding: 6px 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 6px;
    margin-top: 4px;
  }
  .leaflet-popup-content .popup-link {
    display: inline-block;
    margin-top: 8px;
    color: #f5a623;
    text-decoration: none;
    font-size: 13px;
  }
  .leaflet-popup-content .popup-link:hover { text-decoration: underline; }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .header { padding: 14px 18px; }
    .header h1 { font-size: 18px; }
  }

  .leaflet-container { background: #0a0a1a !important; }
</style>
</head>
<body>

<div class="header">
  <h1>🍽️ 我的美食地圖</h1>
  <div class="stats">
    <span id="count">0</span> 間收藏 · <span id="cities">—</span>
  </div>
</div>

<div class="container">
  <div id="map"></div>
  <div class="sidebar">
    <div class="sidebar-header">
      <span>📋 餐廳清單</span>
      <span class="count-badge" id="list-count">0</span>
    </div>
    <div class="search-box">
      <input type="text" id="search" placeholder="🔍 搜尋餐廳名稱或地址..." oninput="applyFilters()">
    </div>
    <div class="filter-bar">
      <select id="city-filter" onchange="applyFilters()">
        <option value="">🏙️ 全部地區</option>
      </select>
    </div>
    <div class="restaurant-list" id="restaurant-list"></div>
  </div>
</div>

<script>
const RESTAURANTS_URL = 'restaurants.json';

let map, markers = [], allRestaurants = [], currentMarker = null;

const taipeiCenter = [25.0340, 121.5645];

function initMap() {
  map = L.map('map', {
    center: taipeiCenter,
    zoom: 13,
    zoomControl: true,
    attributionControl: false
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19
  }).addTo(map);
}

function createIcon(index) {
  const colors = ['#e94560', '#f5a623', '#4ecdc4', '#6c5ce7', '#fd79a8', '#00b894', '#e17055', '#0984e3'];
  const c = colors[index % colors.length];
  return L.divIcon({
    className: 'custom-marker',
    html: `<div style="
      width: 36px; height: 36px;
      background: ${c};
      border: 2px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      cursor: pointer;
    ">🍽</div>`,
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    popupAnchor: [0, -20]
  });
}

function addMarker(r, index) {
  if (!r.lat || !r.lng) return;
  const marker = L.marker([r.lat, r.lng], { icon: createIcon(index) }).addTo(map);

  const noteHtml = r.notes ? `<div class="popup-note">💬 ${r.notes}</div>` : '';
  const linkHtml = r.url ? `<a class="popup-link" href="${r.url}" target="_blank">🔗 查看原文</a>` : '';
  const mapLink = r.lat && r.lng
    ? `<a class="popup-link" href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}" target="_blank" style="margin-left:10px">🗺️ Google 導航</a>`
    : '';

  marker.bindPopup(`
    <div class="popup-name">${r.name}</div>
    <div class="popup-addr">📍 ${r.address || '地址未知'}</div>
    ${noteHtml}
    ${linkHtml}${mapLink}
  `);

  marker.on('click', () => {
    highlightItem(r.id);
  });

  markers.push({ marker, data: r });
}

function renderList(restaurants) {
  const el = document.getElementById('restaurant-list');
  if (!restaurants.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="icon">🗺️</div>
        <h3>地圖還是空的</h3>
        <p>丟餐廳連結給我<br>我就幫你標上去 🚀</p>
      </div>`;
    return;
  }
  el.innerHTML = restaurants.map(r => `
    <div class="restaurant-item" data-id="${r.id}" onclick="focusRestaurant('${r.id}')">
      <div class="date">${formatDate(r.added_at)}</div>
      <div class="name">${r.name}</div>
      <div class="address">📍 ${r.address || '地址未知'}</div>
      <div class="tags">
        ${r.notes ? `<span class="tag note">💬 ${r.notes}</span>` : ''}
        ${r.url ? `<span class="tag">🔗 連結</span>` : ''}
        ${r.lat && r.lng ? `<a class="tag gm-link" href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}" target="_blank" onclick="event.stopPropagation()">🗺️ 導航</a>` : ''}
      </div>
    </div>
  `).join('');
}

function focusRestaurant(id) {
  const r = allRestaurants.find(x => x.id === id);
  if (!r || !r.lat || !r.lng) return;
  map.setView([r.lat, r.lng], 16);
  const m = markers.find(x => x.data.id === id);
  if (m) m.marker.openPopup();
  highlightItem(id);
}

function highlightItem(id) {
  document.querySelectorAll('.restaurant-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.restaurant-item[data-id="${id}"]`);
  if (el) {
    el.classList.add('active');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function extractCity(addr) {
  const m = (addr || '').match(/([臺台紐新桃苗中彰投雲嘉南高屏宜花東澎金連]..?[北市縣鄉鎮區])/);
  return m ? m[1] : null;
}

function getCityList(restaurants) {
  const set = new Set();
  for (const r of restaurants) {
    const c = extractCity(r.address);
    if (c) set.add(c);
  }
  return [...set].sort();
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  const city = document.getElementById('city-filter').value;

  // Filter restaurants
  const filtered = allRestaurants.filter(r => {
    // Text search
    if (q && !r.name.toLowerCase().includes(q) &&
        !(r.address && r.address.toLowerCase().includes(q)) &&
        !(r.notes && r.notes.toLowerCase().includes(q))) return false;
    // City filter
    if (city && extractCity(r.address) !== city) return false;
    return true;
  });

  renderList(filtered);

  // Show/hide map markers
  markers.forEach(({ marker, data }) => {
    const match = filtered.some(f => f.id === data.id);
    if (match) {
      map.addLayer(marker);
    } else {
      map.removeLayer(marker);
    }
  });

  // Update count badge
  document.getElementById('list-count').textContent = filtered.length;

  // Fit bounds to visible markers
  const visible = markers.filter(m => map.hasLayer(m.marker));
  if (visible.length > 0) {
    const group = L.featureGroup(visible.map(m => m.marker));
    map.fitBounds(group.getBounds().pad(0.15));
  } else if (markers.length > 0) {
    // No visible markers, show all
    const group = L.featureGroup(markers.map(m => m.marker));
    map.fitBounds(group.getBounds().pad(0.15));
  }
}

// Legacy alias kept for compatibility
const filterRestaurants = applyFilters;

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function getCities(restaurants) {
  const citySet = new Set();
  for (const r of restaurants) {
    const c = extractCity(r.address);
    if (c) citySet.add(c);
  }
  return citySet.size > 0 ? [...citySet].join('、') : '—';
}

function loadData() {
  fetch(RESTAURANTS_URL)
    .then(res => res.json())
    .then(data => {
      allRestaurants = data.restaurants || [];
      document.getElementById('count').textContent = allRestaurants.length;
      document.getElementById('list-count').textContent = allRestaurants.length;
      document.getElementById('cities').textContent = getCities(allRestaurants);

      // Populate city filter dropdown
      const citySelect = document.getElementById('city-filter');
      getCityList(allRestaurants).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        citySelect.appendChild(opt);
      });

      allRestaurants.forEach((r, i) => addMarker(r, i));
      renderList(allRestaurants);

      // Auto-fit map to show all pins
      if (markers.length > 0) {
        const group = L.featureGroup(markers.map(m => m.marker));
        map.fitBounds(group.getBounds().pad(0.15));
      }
    })
    .catch(() => {
      document.getElementById('restaurant-list').innerHTML = `
        <div class="empty-state">
          <div class="icon">🗺️</div>
          <h3>地圖還是空的</h3>
          <p>丟餐廳連結給我<br>我就幫你標上去 🚀</p>
        </div>`;
    });
}

initMap();
loadData();
</script>
</body>
</html>
